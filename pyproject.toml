[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripreco"
version = "1.0.0"
description = "Recommend a similar TripAdvisor place from its reviews only (BM25, TF-IDF, LSA)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "rank-bm25==0.2.2", "ruff==0.16.9"]

[project.scripts]
tripreco = "tripreco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
